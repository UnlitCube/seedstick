# push と PR のたびに回す検査。
#
# 3 つの OS でユニットテストを回し、Windows では「パッケージして起動する」まで見る。
# 重いビルド（LZMA2 で 2 分、梱包で 3 分）は release.yml がタグのときだけ走らせる。
#
# ただし「タグを打って初めてパッケージの壊れに気づく」のは避けたいので、
# **`--dir` までのパッケージ（カナリア）はここで毎回通し、実際に起動させる**。
# `files` の指定漏れ・asar の中身・`extraResources` の解決は
# パッケージしないと出ない壊れ方で（落とし穴 133 / 134）、
# そこだけなら圧縮を通さずに数十秒で見られる。
#
# Action は**コミット SHA で固定**する（タグは書き換えられる）。
# 更新は Dependabot（.github/dependabot.yml）が PR で持ってくる。

name: ci

on:
  push:
    # branches だけを書くと、タグの push はこのワークフローに一致しない
    # （タグは release.yml が拾う）
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 既定を読み取りだけにする。このワークフローは何も書かない。
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # デバイスに触らない検査はここに寄せる。
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # engines: node >=22（node:zlib の crc32 を使う）
          cache: npm
          cache-dependency-path: package-lock.json

      # 生成した early-commands を本物の python3 + PyYAML で走らせるテストがある。
      # 版は Ubuntu 24.04 の python3-yaml と同じ（yaml.test.ts の実測表もこの版）。
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: PyYAML
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.1"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      # ルートで 1 回。npm workspaces なので packages/* と apps/* が全部入る。
      # **`--omit=dev` にしない**（electron / electron-builder / vitest は全部 devDependency）。
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # 本番依存が変わったのに通知文を作り直していなければ落ちる。
      # 本番依存にコピーレフトや不明なライセンスが入っても落ちる。
      - name: THIRD_PARTY_NOTICES が最新か
        run: node scripts/gen-third-party-notices.mjs --check

      - name: ユニットテスト
        run: npm run test:unit

      # ISO も実デバイスも触らない番人。数秒で終わる。
      - name: RAID / bond の生成検証
        run: npm run e2e:raid-bond

      - name: ESP 複製の late-command を本物の sh で走らせる
        run: npm run e2e:esp-mirror

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # **ランナーの Python には PyYAML が無い。** 無いと runtime-values.test.ts が
      # 「PyYAML が要る」という 1 件の失敗で止まる（以前は 15 件が同じ 180 行を出して落ち、
      # しかも 2 件は誤った理由で緑になっていた）。
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: PyYAML
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.1"
          python -c "import yaml; print('PyYAML', yaml.__version__)"

      - run: npm ci

      # **`shell: bash` が要る。** テストが `spawnSync('sh', …)` で
      # 生成したシェルを本物の sh に食わせており、Windows ランナーの既定 (pwsh) では
      # `sh` が PATH に無くて落ちる（落とし穴 153）。
      - name: ユニットテスト
        shell: bash
        run: npm run test:unit

      - name: uninstall.ps1 を本物の PowerShell で走らせる
        shell: bash
        run: npm run e2e:uninstall-script

      # カナリア。圧縮も梱包もせず、**パッケージできることだけ**を見る。
      # `--dir` は electron-builder の CLI が target を DIR に上書きするので、
      # `electron-builder.json` の win.target（portable）は使われない。
      - name: パッケージのカナリア（--dir のみ・圧縮しない）
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          npx electron-vite build
          npx electron-builder --win --dir \
            --config electron-builder.json \
            -c.electronVersion="$(node -p "require('electron/package.json').version")" \
            -c.directories.output=release/canary

      # **「できた」で終わらせない。** 中身が入っているかまで見る（落とし穴 134）。
      - name: 中身を数える
        shell: bash
        run: |
          set -euo pipefail
          d="apps/desktop/release/canary/win-unpacked"
          test -f "$d/Seedstick.exe"                      || { echo "::error::本体の exe が無い"; exit 1; }
          test -f "$d/resources/app.asar"                 || { echo "::error::app.asar が無い"; exit 1; }
          # extraResources で同梱されるもの（落とし穴 134 はサンプルを入れ忘れた話）
          test -f "$d/resources/samples/ip-only.json"     || { echo "::error::samples が同梱されていない"; exit 1; }
          test -f "$d/resources/LICENSE.txt"              || { echo "::error::LICENSE が同梱されていない"; exit 1; }
          test -f "$d/resources/THIRD_PARTY_NOTICES.txt"  || { echo "::error::THIRD_PARTY_NOTICES が同梱されていない"; exit 1; }
          test -f "$d/LICENSES.chromium.html"             || { echo "::error::Chromium のライセンス文が無い"; exit 1; }
          # インストーラが本体の asar に紛れ込んでいないこと（files の "!out/installer/**/*"）。
          # **asar の一覧は Windows では `\` 区切り**で出るので、区切り文字を問わずに探す。
          # 以前の `grep -q '/installer/'` は一度も一致せず、検査が常に通っていた。
          # パイプで grep -q すると書き手が SIGPIPE で落ちうるので、いったんファイルに書く。
          npx asar list "$d/resources/app.asar" > asar-list.txt
          test -s asar-list.txt || { echo "::error::asar の一覧が空（走査が空振りしている）"; exit 1; }
          if grep -qE '[\\/]out[\\/]installer([\\/]|$)' asar-list.txt; then
            echo "::error::app.asar にインストーラが入っている（files の除外が効いていない）"
            exit 1
          fi
          # FFmpeg がコーデック抜きの公式版に差し替わっていること（after-pack.cjs）。
          # Electron が同梱する版（H.264 / AAC 入り）と同じなら、差し替えが効いていない。
          shipped=$(sha256sum "$d/ffmpeg.dll" | cut -d' ' -f1)
          original=$(sha256sum node_modules/electron/dist/ffmpeg.dll | cut -d' ' -f1)
          echo "ffmpeg.dll shipped=$shipped electron=$original"
          [ "$shipped" != "$original" ] || { echo "::error::ffmpeg.dll が差し替わっていない（proprietary codecs 入りのまま）"; exit 1; }
          echo "ok: $(du -sh "$d" | cut -f1)"

      - name: パッケージ版が起動して画面を出すか
        shell: bash
        run: node scripts/smoke-packaged.mjs apps/desktop/release/canary/win-unpacked/Seedstick.exe --timeout 120

  # macOS ではユニットテストだけを回す（パッケージは release.yml）。
  # 生成したシェルを本物の sh / python3 / shasum で走らせるテストがあるので、
  # BSD 系のコマンドで壊れていないかをここで見る。
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: PyYAML
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.1"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - run: npm ci

      - name: ユニットテスト
        run: npm run test:unit
